      let currentVideo = null;

      function PlayVideo(button) {
        const videoUrl = button.getAttribute("data-url");
        if (currentVideo) {
          currentVideo.pause();
          currentVideo.remove();
          currentVideo = null;
        }
        const videoElement = document.createElement("video");
        videoElement.src = videoUrl;
        videoElement.controls = true;
        videoElement.autoplay = true;
        videoElement.style.display = "block";
        button.parentElement.appendChild(videoElement);
        currentVideo = videoElement;
      }

      function formatDuration(minutes) {
        const hrs = Math.floor(minutes / 60);
        const mins = Math.round(minutes % 60);
        if (hrs > 0) return hrs + "h " + mins + "m";
        return mins + " min";
      }

      function groupByTopic(lectures) {
        const groups = {};
        lectures.forEach((item) => {
          const g = item.groupName || "GENERAL";
          if (!groups[g]) groups[g] = [];
          groups[g].push(item);
        });
        return groups;
      }

      function renderAll() {
        const container = document.getElementById("topics-container");
        container.innerHTML = "";

        for (const [unitName, lectures] of Object.entries(allUnits)) {
          const unitSection = document.createElement("div");
          unitSection.classList.add("unit-section");

          const unitHeading = document.createElement("div");
          unitHeading.classList.add("unit-heading");
          unitHeading.textContent = unitName + " (" + lectures.length + " lectures)";
          unitSection.appendChild(unitHeading);

          const unitContent = document.createElement("div");
          unitContent.classList.add("unit-content");

          unitHeading.addEventListener("click", () => {
            unitContent.style.display = unitContent.style.display === "block" ? "none" : "block";
          });

          const groups = groupByTopic(lectures);

          for (const [title, topics] of Object.entries(groups)) {
            const groupElement = document.createElement("div");
            groupElement.classList.add("topic-group");

            const titleElement = document.createElement("div");
            titleElement.classList.add("group-title");
            titleElement.textContent = title + " (" + topics.length + " lectures)";
            titleElement.addEventListener("click", () => {
              const content = groupElement.querySelector(".topic-content");
              content.style.display = content.style.display === "block" ? "none" : "block";
            });

            const contentElement = document.createElement("div");
            contentElement.classList.add("topic-content");

            topics.forEach((topic) => {
              const topicElement = document.createElement("div");
              topicElement.classList.add("topic");
              let linksHTML = "";
              if (topic.handout1Url) {
                linksHTML += '<a href="' + topic.handout1Url + '" rel="noreferrer" target="_blank">PDF Link</a>';
              }
              if (topic.s3LinkLow) {
                linksHTML += '<a href="' + topic.s3LinkLow + '" rel="noreferrer" target="_blank">Video Link</a>';
                linksHTML += '<button onclick="PlayVideo(this)" data-url="' + topic.s3LinkLow + '">Play</button>';
              }
              topicElement.innerHTML =
                '<div class="subtitle">' + topic.lectureTitle + ' <span style="color:#888; font-size:0.85em;">(' + formatDuration(topic.duration) + ')</span></div>' +
                '<div class="links">' + linksHTML + '</div>';
              contentElement.appendChild(topicElement);
            });

            groupElement.appendChild(titleElement);
            groupElement.appendChild(contentElement);
            unitContent.appendChild(groupElement);
          }

          unitSection.appendChild(unitContent);
          container.appendChild(unitSection);
        }
      }

      renderAll();
    </script>
