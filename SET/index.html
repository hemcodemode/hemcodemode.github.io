  .badge{background:#4B4DED;color:#fff;padding:2px 12px;border-radius:12px;font-size:13px;font-weight:600}
  .chevron{transition:transform .2s;font-size:18px;color:#888}
  .folder.collapsed .chevron{transform:rotate(-90deg)}
  .folder.collapsed .folder-body{display:none}
  .folder-body{padding:0}
  .pdf-item{display:flex;align-items:center;padding:12px 20px;border-top:1px solid #f0f0f0;gap:12px;transition:background .15s}
  .pdf-item:hover{background:#f8f9ff}
  .pdf-num{color:#999;font-size:13px;min-width:28px;text-align:right;font-weight:500}
  .pdf-icon{width:32px;height:32px;background:#fee2e2;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}

  .pdf-size{font-size:12px;color:#888;margin-top:2px}
  .pdf-actions{display:flex;gap:8px;flex-shrink:0}
  .btn{padding:6px 14px;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;display:inline-flex;align-items:center;gap:4px;transition:background .15s}
  .btn-view{background:#e0e7ff;color:#4B4DED}
  .btn-view:hover{background:#c7d2fe}
  .btn-dl{background:#d1fae5;color:#065f46}
  .btn-dl:hover{background:#a7f3d0}
  .footer{text-align:center;padding:30px;color:#999;font-size:13px}
  .hidden{display:none!important}
  @media(max-width:600px){
    .header h1{font-size:22px}
    .pdf-actions{flex-direction:column;gap:4px}
    .btn{padding:5px 10px;font-size:12px}

const container = document.getElementById('folders');

function render(filter) {
  container.innerHTML = '';
  const q = (filter || '').toLowerCase();
  DATA.forEach((section, si) => {
    const filtered = q ? section.files.filter(f => f.title.toLowerCase().includes(q) || section.folder.toLowerCase().includes(q)) : section.files;
    if (!filtered.length) return;
    const div = document.createElement('div');
    div.className = 'folder';
    div.innerHTML =
      '<div class="folder-head" onclick="this.parentElement.classList.toggle(\'collapsed\')">' +
        '<h2>' + section.folder + '</h2>' +
        '<div style="display:flex;align-items:center;gap:10px"><span class="badge">' + filtered.length + '</span><span class="chevron">&#9662;</span></div>' +
      '</div>' +
      '<div class="folder-body">' +
        filtered.map((f, i) =>
          '<div class="pdf-item">' +
            '<span class="pdf-num">' + (i + 1) + '</span>' +
            '<div class="pdf-icon">PDF</div>' +
            '<div class="pdf-info"><div class="pdf-title">' + f.title + '</div><div class="pdf-size">' + f.size + '</div></div>' +
            '<div class="pdf-actions">' +
              '<a class="btn btn-view" href="' + encodeURI(f.file) + '" target="_blank">View</a>' +
              '<a class="btn btn-dl" href="' + encodeURI(f.file) + '" download>Download</a>' +
            '</div>' +
          '</div>'
        ).join('') +
      '</div>';
    container.appendChild(div);
  });
}

render();

let debounce;
document.getElementById('search').addEventListener('input', function() {
  clearTimeout(debounce);
  debounce = setTimeout(() => render(this.value), 200);
});
